<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Messenger Voice</title>


<link rel="stylesheet" href="style.css">


<script src="/socket.io/socket.io.js"></script>


</head>


<body>


<div class="app">



<!-- СЕРВЕРА -->

<div class="servers">


<h3>🏠</h3>


<button onclick="createServer()">
➕
</button>


<div id="servers"></div>


</div>







<!-- КОМНАТЫ -->

<div class="rooms">


<h3>Комнаты</h3>


<button onclick="createTextRoom()">
💬
</button>


<button onclick="createVoiceRoom()">
🔊
</button>



<div id="rooms"></div>



<hr>



<h3>Онлайн</h3>

<div id="users"></div>



</div>









<!-- ЧАТ -->

<div class="chat">



<div class="chat-header">

Messenger

</div>





<div id="messages"
class="messages">

</div>






<div class="send">


<input 
id="message"
placeholder="Сообщение..."
>


<button onclick="sendMessage()">

➤

</button>


</div>



</div>









<!-- ГОЛОС -->

<div class="voice">


<h3>
🔊 Голос
</h3>



<div id="voiceRoom">

Нет комнаты

</div>



<button onclick="joinVoice()">

🎤 Войти

</button>




<button onclick="leaveVoice()">

❌ Выйти

</button>




<button onclick="muteMic()">

🔇 Микрофон

</button>



<h4>
Игроки:
</h4>


<div id="voiceUsers">

</div>



</div>






</div>







<script src="app.js"></script>


</body>

</html>
