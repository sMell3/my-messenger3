<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Messenger Voice</title>


<link rel="stylesheet" href="style.css">


<script src="/socket.io/socket.io.js"></script>


</head>


<body>


<div class="app">


<div class="header">

💬 Messenger + Voice

</div>





<div id="login">


<h2>
Вход
</h2>


<input 
id="nickname"
placeholder="Введите ник"
>


<button onclick="join()">

Войти

</button>


</div>








<div id="chat" style="display:none;">



<div class="content">





<div class="chat-box">


<div id="messages" class="messages">


</div>




<div class="send">


<input
id="message"
placeholder="Сообщение..."
>


<button onclick="sendMessage()">

➤

</button>


</div>



</div>









<div class="side">


<h3>
👥 Онлайн
</h3>


<div id="online">

</div>




<hr>


<h3>
🎤 Голос

</h3>



<button onclick="startVoice()">

🎙 Включить микрофон

</button>



<button onclick="muteVoice()">

🔇 Выключить микрофон

</button>



<div id="voiceUsers">

</div>



</div>






</div>


</div>



</div>






<script src="app.js"></script>


</body>


</html>
