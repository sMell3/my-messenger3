<!DOCTYPE html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Messenger v4</title>


<link rel="stylesheet" href="style.css">


<script src="/socket.io/socket.io.js"></script>


</head>



<body>


<div class="app">



<!-- СЕРВЕРА -->

<div class="servers">


<h3>🏠 Серверы</h3>


<button onclick="createServer()">
➕
</button>


<div id="servers"></div>


</div>








<!-- КОМНАТЫ -->

<div class="rooms">


<h3>Комнаты</h3>


<button onclick="createRoom()">
➕
</button>

<hr>

</div>









<!-- ЧАТ -->

<div class="chat">



<div class="chat-header">

Messenger

</div>





<div id="messages"
class="messages">

</div>

<input
id="message"
placeholder="Написать сообщение..."
>

➤

</button>


</div>



</div>



</div>






<script src="app.js"></script>


</body>

</html>
